name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare direct download
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination 'dist/FrameForge-Setup.exe'
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: FrameForge-Windows
          path: dist/FrameForge-Setup.exe
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: FrameForge-Windows
          path: release
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/FrameForge-Setup.exe
          release_tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" release/FrameForge-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FrameForge ${VERSION} for Windows" \
            --notes "Windows x64 installer. FFmpeg can be downloaded inside the app. This installer is currently unsigned." \
            --latest
